# .github/workflows/ci.yml
# Repo : EasyVTC_Mobile
name: CI — EasyVTC Mobile (Expo)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : TypeScript + Tests unitaires
  # Tourne sur chaque push/PR vers develop ou main
  # ─────────────────────────────────────────────
  test-mobile:
    name: TypeScript + Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --ci --watchAll=false --passWithNoTests
        env:
          EXPO_PUBLIC_API_URL: http://localhost:4000

  # ─────────────────────────────────────────────
  # Job 2a : EAS Build Preview — Android (develop uniquement)
  # Nécessite le secret EXPO_TOKEN dans GitHub → Settings → Secrets
  # ─────────────────────────────────────────────
  eas-preview-android:
    name: EAS Build — Preview Android (develop)
    needs: test-mobile
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Preview (Android)
        run: eas build --platform android --profile preview --non-interactive --no-wait

  # ─────────────────────────────────────────────
  # Job 2b : EAS Build Preview — iOS (develop uniquement)
  # Nécessite le secret EXPO_TOKEN dans GitHub → Settings → Secrets
  # Bloqué tant qu'aucun profil Ad Hoc/appareil de test n'est enregistré
  # côté Apple Developer — voir NOTE_CI_IOS.md
  # ─────────────────────────────────────────────
  eas-preview-ios:
    name: EAS Build — Preview iOS (develop)
    needs: test-mobile
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Preview (iOS)
        run: eas build --platform ios --profile preview --non-interactive --no-wait

  # ─────────────────────────────────────────────
  # Job 3a : EAS Build Production — Android (main uniquement)
  # Nécessite le secret EXPO_TOKEN dans GitHub → Settings → Secrets
  # ─────────────────────────────────────────────
  eas-production-android:
    name: EAS Build — Production Android (main)
    needs: test-mobile
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Production (Android)
        run: eas build --platform android --profile production --non-interactive --no-wait

  # ─────────────────────────────────────────────
  # Job 3b : EAS Build Production — iOS (main uniquement)
  # Nécessite le secret EXPO_TOKEN dans GitHub → Settings → Secrets
  # ─────────────────────────────────────────────
  eas-production-ios:
    name: EAS Build — Production iOS (main)
    needs: test-mobile
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Production (iOS)
        run: eas build --platform ios --profile production --non-interactive --no-wait
